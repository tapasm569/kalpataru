name: Build Kalpataru APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI (PWA to APK Converter)
        run: npm install -g @bubblewrap/cli

      - name: Create Web Manifest for WebView
        run: |
          cat << 'EOM' > manifest.json
          {
            "name": "Kalpataru Blood Donors",
            "short_name": "Kalpataru",
            "start_url": "https://kalpataru.pages.dev",
            "display": "standalone",
            "background_color": "#dc2626",
            "theme_color": "#dc2626"
          }
          EOM

      - name: Build Android Package via WebAPK Generator
        run: |
          npx pwabuilder-android-generator --manifest manifest.json --output ./android-app || true

      - name: Fallback Direct WebView Gradle Build
        if: always()
        run: |
          if [ -d "android-app" ] && [ -f "android-app/gradlew" ]; then
            cd android-app
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Find and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalpataru-App-Debug
          path: |
            *.apk
            android-app/**/*.apk
            **/build/outputs/apk/debug/*.apk
