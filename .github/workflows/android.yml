name: Build Kalpataru APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Native Android Wrapper CLI
        run: |
          npm install -g cordova

      - name: Create Cordova Project Wrapper
        run: |
          cordova create myapp com.kalpataru.humanitarian KalpataruBlood
          cd myapp
          # Replace default www index with our Kalpataru index.html
          cp ../index.html www/index.html
          cordova platform add android

      - name: Build APK via Cordova Gradle
        run: |
          cd myapp
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalpataru-App-Debug
          path: myapp/platforms/android/app/build/outputs/apk/debug/*.apk
