name: Build Kalpataru APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Native Android WebView Project with Custom App Icon & Build APK
        run: |
          mkdir -p android-project/app/src/main/java/com/kalpataru/humanitarian
          mkdir -p android-project/app/src/main/res/drawable
          mkdir -p android-project/app/src/main/res/mipmap-anydpi-v26

          cat << 'SETTINGS' > android-project/settings.gradle
          rootProject.name = "KalpataruBlood"
          include ':app'
          SETTINGS

          cat << 'ROOTGRADLE' > android-project/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          ROOTGRADLE

          cat << 'PROPS' > android-project/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          PROPS

          cat << 'APPGRADLE' > android-project/app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.kalpataru.humanitarian'
              compileSdk 34

              defaultConfig {
                  applicationId "com.kalpataru.humanitarian"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          APPGRADLE

          # 1. Custom Icon Background (Deep Ruby Crimson with Subtle Inner Ring)
          cat << 'ICON_BG' > android-project/app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#9F1239"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#E11D48"
                  android:pathData="M54,54m-46,0a46,46 0,1 1,92 0a46,46 0,1 1,-92 0" />
              <path
                  android:fillColor="#BE123C"
                  android:pathData="M54,54m-38,0a38,38 0,1 1,76 0a38,38 0,1 1,-76 0" />
          </vector>
          ICON_BG

          # 2. Custom Icon Foreground (Pure White Blood Drop + Humanitarian Medical Cross)
          cat << 'ICON_FG' > android-project/app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Outer Golden/Soft Glow Ring -->
              <path
                  android:strokeColor="#FECDD3"
                  android:strokeWidth="1.8"
                  android:fillColor="#00000000"
                  android:pathData="M54,54m-34,0a34,34 0,1 1,68 0a34,34 0,1 1,-68 0" />
              <!-- White Blood Droplet -->
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,24 C54,24 33,49 33,64 C33,75.6 42.4,85 54,85 C65.6,85 75,75.6 75,64 C75,49 54,24 54,24 Z" />
              <!-- Ruby Medical Cross Inside the Blood Drop -->
              <path
                  android:fillColor="#E11D48"
                  android:pathData="M51,54 H57 V61 H64 V67 H57 V74 H51 V67 H44 V61 H51 Z" />
          </vector>
          ICON_FG

          # 3. Single-File Fallback Vector Icon for Older Android Launchers
          cat << 'ICON_FALLBACK' > android-project/app/src/main/res/drawable/ic_launcher_legacy.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#E11D48"
                  android:pathData="M18,0 L90,0 A18,18 0 0,1 108,18 L108,90 A18,18 0 0,1 90,108 L18,108 A18,18 0 0,1 0,90 L0,18 A18,18 0 0,1 18,0 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,20 C54,20 30,48 30,65 C30,78.2 40.8,89 54,89 C67.2,89 78,78.2 78,65 C78,48 54,20 54,20 Z" />
              <path
                  android:fillColor="#E11D48"
                  android:pathData="M50.5,54 H57.5 V61.5 H65 V68.5 H57.5 V76 H50.5 V68.5 H43 V61.5 H50.5 Z" />
          </vector>
          ICON_FALLBACK

          # 4. Adaptive Icon Wrapper (Android 8.0+)
          cat << 'ADAPTIVE' > android-project/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          ADAPTIVE

          # 5. AndroidManifest with Custom Icon & Round Icon
          cat << 'MANIFEST' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:label="Kalpataru Blood"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          # 6. MainActivity pointing to https://kalpatarutest.pages.dev/
          cat << 'JAVA' > android-project/app/src/main/java/com/kalpataru/humanitarian/MainActivity.java
          package com.kalpataru.humanitarian;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Window;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(Color.parseColor("#4C0519"));

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setDatabaseEnabled(true);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("tel:") || url.startsWith("whatsapp:") || url.contains("wa.me")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(intent);
                              } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  });

                  webView.loadUrl("https://kalpatarutest.pages.dev/");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVA

          cd android-project
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalpataru-Blood-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
