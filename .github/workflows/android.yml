name: Build Kalpataru APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Native Android Project & Build APK
        run: |
          mkdir -p android-project/app/src/main/java/com/kalpataru/humanitarian
          mkdir -p android-project/app/src/main/res/drawable
          mkdir -p android-project/app/src/main/res/mipmap-anydpi-v26

          cat << 'SETTINGS' > android-project/settings.gradle
          rootProject.name = "Kalpataru"
          include ':app'
          SETTINGS

          cat << 'ROOTGRADLE' > android-project/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          ROOTGRADLE

          cat << 'PROPS' > android-project/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          PROPS

          cat << 'APPGRADLE' > android-project/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.kalpataru.humanitarian'
              compileSdk 34
              defaultConfig {
                  applicationId "com.kalpataru.humanitarian"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "1.2"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          APPGRADLE

          # App Icon Background (Deep Ruby Crimson)
          cat << 'ICON_BG' > android-project/app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" viewportWidth="108" viewportHeight="108">
              <path android:fillColor="#881337" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#E11D48" android:pathData="M54,54m-48,0a48,48 0,1 1,96 0a48,48 0,1 1,-96 0" />
              <path android:fillColor="#BE123C" android:pathData="M54,54m-40,0a40,40 0,1 1,80 0a40,40 0,1 1,-80 0" />
          </vector>
          ICON_BG

          # App Icon Foreground (Blood Drop + Kalpataru K Emblem)
          cat << 'ICON_FG' > android-project/app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" viewportWidth="108" viewportHeight="108">
              <path android:strokeColor="#FECDD3" android:strokeWidth="2" android:fillColor="#00000000"
                  android:pathData="M54,54m-35,0a35,35 0,1 1,70 0a35,35 0,1 1,-70 0" />
              <!-- Blood Droplet -->
              <path android:fillColor="#FFFFFF"
                  android:pathData="M54,22 C54,22 31,48 31,65 C31,77.7 41.3,88 54,88 C66.7,88 77,77.7 77,65 C77,48 54,22 54,22 Z" />
              <!-- Medical Cross in Droplet -->
              <path android:fillColor="#E11D48"
                  android:pathData="M51,52 H57 V60 H65 V66 H57 V74 H51 V66 H43 V60 H51 Z" />
          </vector>
          ICON_FG

          cat << 'ADAPTIVE' > android-project/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          ADAPTIVE

          cat << 'MANIFEST' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="Kalpataru"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          cat << 'JAVA' > android-project/app/src/main/java/com/kalpataru/humanitarian/MainActivity.java
          package com.kalpataru.humanitarian;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              public class AndroidPrintBridge {
                  @JavascriptInterface
                  public void printDocument(final String title) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              PrintManager printManager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                              if (printManager != null && webView != null) {
                                  PrintDocumentAdapter printAdapter = webView.createPrintDocumentAdapter(title != null ? title : "Kalpataru_Card");
                                  printManager.print(title != null ? title : "Kalpataru_Card", printAdapter, new PrintAttributes.Builder().build());
                              }
                          }
                      });
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(Color.parseColor("#4C0519"));

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setDatabaseEnabled(true);

                  // Native Print Interface for Android App
                  webView.addJavascriptInterface(new AndroidPrintBridge(), "AndroidPrint");

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("tel:") || url.startsWith("whatsapp:") || url.contains("wa.me")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(intent);
                              } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  });

                  webView.loadUrl("https://kalpatarutest.pages.dev/");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVA

          cd android-project
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalpataru-App
          path: android-project/app/build/outputs/apk/debug/*.apk
