name: Build Kalpataru APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova & Create App
        run: |
          npm install -g cordova
          cordova create myapp com.kalpataru.humanitarian "Kalpataru Blood"
          cd myapp

          # If index.html is in the repo, use it; otherwise load the live Cloudflare app
          if [ -f "../index.html" ]; then
            cp ../index.html www/index.html
          else
            cat << 'HTML' > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Kalpataru Blood Donor Portal</title>
            <style>
              body, html { margin:0; padding:0; height:100%; background:#4c0519; color:#fff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; text-align:center; }
            </style>
            <script>
              window.location.replace("https://kalpataru.kalpatarutest.workers.dev");
            </script>
          </head>
          <body>
            <div>
              <h2>🩸 Kalpataru Humanitarian Initiative</h2>
              <p>Loading Blood Donor Portal...</p>
            </div>
          </body>
          </html>
          HTML
          fi

          # Allow Internet, Supabase, WhatsApp, and Phone Call permissions
          cat << 'XML' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.kalpataru.humanitarian" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>Kalpataru Blood</name>
              <description>Kalpataru Humanitarian Initiative Blood Donor Portal</description>
              <author email="info@kalpataru.org" href="https://kalpataru.kalpatarutest.workers.dev">Kalpataru NGO</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-navigation href="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-intent href="tel:*" />
              <allow-intent href="sms:*" />
              <allow-intent href="mailto:*" />
              <allow-intent href="geo:*" />
              <allow-intent href="whatsapp:*" />
              <preference name="CleartextTrafficPermitted" value="true" />
          </widget>
          XML

          cordova platform add android@12.0.1
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalpataru-Blood-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/*.apk
