name: Build Kalpataru APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Web App to APK
        uses: darkshredder/website-to-apk-action@v1.4
        with:
          build-folder-path: '.'
          app-name: 'Kalpataru Blood'
          output-folder-path: 'output-apk'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalpataru-App-Debug
          path: output-apk/*.apk
