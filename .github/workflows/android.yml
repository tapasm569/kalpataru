name: Build Kalpataru APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python for Icon Generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow & Generate Kalpataru App Icon
        run: |
          pip install pillow
          mkdir -p android-project/app/src/main/res/mipmap-mdpi
          mkdir -p android-project/app/src/main/res/mipmap-hdpi
          mkdir -p android-project/app/src/main/res/mipmap-xhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxxhdpi

          python3 - << 'PYEOF'
          import os
          from PIL import Image, ImageDraw, ImageFont

          # Master 512x512 High-Res Icon
          size = 512
          img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)

          # 1. Outer Deep Ruby Badge
          draw.ellipse([16, 16, 496, 496], fill=(225, 29, 72, 255))
          draw.ellipse([28, 28, 484, 484], fill=(136, 19, 55, 255))
          draw.ellipse([38, 38, 474, 474], outline=(254, 205, 211, 255), width=5)

          # 2. White Blood Droplet
          draw.ellipse([166, 140, 346, 320], fill=(255, 255, 255, 255))
          draw.polygon([(256, 60), (170, 220), (342, 220)], fill=(255, 255, 255, 255))

          # 3. Red Medical Heart-Cross inside the Droplet
          draw.rectangle([242, 175, 270, 265], fill=(225, 29, 72, 255))
          draw.rectangle([212, 205, 300, 235], fill=(225, 29, 72, 255))

          # 4. Ribbon Banner for App Title
          draw.rounded_rectangle([60, 348, 452, 432], radius=26, fill=(76, 5, 25, 255), outline=(254, 205, 211, 255), width=4)

          # 5. Bold Crisp Text: "KALPATARU"
          font = None
          for font_path in [
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              "/usr/share/fonts/truetype/freefont/FreeSansBold.ttf",
              "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf"
          ]:
              if os.path.exists(font_path):
                  font = ImageFont.truetype(font_path, 46)
                  break
          if not font:
              font = ImageFont.load_default()

          bbox = draw.textbbox((0, 0), "KALPATARU", font=font)
          tw = bbox[2] - bbox[0]
          th = bbox[3] - bbox[1]
          tx = (512 - tw) // 2
          ty = 348 + (84 - th) // 2 - 6
          draw.text((tx, ty), "KALPATARU", fill=(255, 255, 255, 255), font=font)

          # Export into all Android Mipmap Densities
          sizes = {
              "mipmap-mdpi": (48, 48),
              "mipmap-hdpi": (72, 72),
              "mipmap-xhdpi": (96, 96),
              "mipmap-xxhdpi": (144, 144),
              "mipmap-xxxhdpi": (192, 192)
          }

          for folder, dims in sizes.items():
              resized = img.resize(dims, Image.Resampling.LANCZOS)
              resized.save(f"android-project/app/src/main/res/{folder}/ic_launcher.png")
              resized.save(f"android-project/app/src/main/res/{folder}/ic_launcher_round.png")

          print("Successfully generated Kalpataru text & blood emblem icons!")
          PYEOF

      - name: Generate Native Android Project & Build APK
        run: |
          mkdir -p android-project/app/src/main/java/com/kalpataru/humanitarian

          cat << 'SETTINGS' > android-project/settings.gradle
          rootProject.name = "Kalpataru"
          include ':app'
          SETTINGS

          cat << 'ROOTGRADLE' > android-project/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          ROOTGRADLE

          cat << 'PROPS' > android-project/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          PROPS

          cat << 'APPGRADLE' > android-project/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.kalpataru.humanitarian'
              compileSdk 34
              defaultConfig {
                  applicationId "com.kalpataru.humanitarian"
                  minSdk 24
                  targetSdk 34
                  versionCode 4
                  versionName "1.3"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          APPGRADLE

          cat << 'MANIFEST' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="Kalpataru"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          cat << 'JAVA' > android-project/app/src/main/java/com/kalpataru/humanitarian/MainActivity.java
          package com.kalpataru.humanitarian;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              public class AndroidPrintBridge {
                  @JavascriptInterface
                  public void printDocument(final String title) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              PrintManager printManager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                              if (printManager != null && webView != null) {
                                  PrintDocumentAdapter printAdapter = webView.createPrintDocumentAdapter(title != null ? title : "Kalpataru_Card");
                                  printManager.print(title != null ? title : "Kalpataru_Card", printAdapter, new PrintAttributes.Builder().build());
                              }
                          }
                      });
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(Color.parseColor("#4C0519"));

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setDatabaseEnabled(true);

                  webView.addJavascriptInterface(new AndroidPrintBridge(), "AndroidPrint");

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("tel:") || url.startsWith("whatsapp:") || url.contains("wa.me")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(intent);
                              } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  });

                  webView.loadUrl("https://kalpatarutest.pages.dev/");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVA

          cd android-project
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalpataru-App
          path: android-project/app/build/outputs/apk/debug/*.apk
